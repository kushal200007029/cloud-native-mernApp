
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pathnex-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/kushal200007029/cloud-native-mernApp.git
    targetRevision: main
    path: gitops/root-app/children
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
