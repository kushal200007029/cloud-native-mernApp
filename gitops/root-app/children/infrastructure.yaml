
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pathnex-infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default

  source:
    repoURL: https://github.com/kushal200007029/cloud-native-mernApp.git
    targetRevision: main
    path: gitops/infrastructure/storage

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
