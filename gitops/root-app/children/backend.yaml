
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pathnex-backend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kushal200007029/cloud-native-mernApp.git
    targetRevision: main
    path: gitops/applications/backend
    helm:
      releaseName: backend

  destination:
    server: https://kubernetes.default.svc
    namespace: pathnex

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
