
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathnex-frontend
  labels:
    app: pathnex-frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pathnex-frontend
  template:
    metadata:
      labels:
        app: pathnex-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set to a Git commit SHA" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
