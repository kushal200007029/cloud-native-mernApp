
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pathnex-mongodb-external-secret
  namespace: pathnex
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: pathnex-aws-secrets
    kind: SecretStore

  target:
    name: pathnex-mongodb-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MONGO_URI: "mongodb://{{ "{{" }} .username {{ "}}" }}:{{ "{{" }} .password {{ "}}" }}@mongodb.pathnex.svc.cluster.local:27017/pathnex?authSource=admin"
  data:
    - secretKey: username
      remoteRef:
        key: pathnex/mongodb
        property: username

    - secretKey: password
      remoteRef:
        key: pathnex/mongodb
        property: password
