
replicaCount: 1

image:
  repository: mongo
  tag: "8.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 27017

persistence:
  enabled: true
  storageClass: gp3
  accessMode: ReadWriteOnce
  size: 10Gi

mongodb:
  database: pathnex
  existingSecret: pathnex-mongodb-secret

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
