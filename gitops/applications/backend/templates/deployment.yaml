
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathnex-backend
  labels:
    app: pathnex-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pathnex-backend
  template:
    metadata:
      labels:
        app: pathnex-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set to a Git commit SHA" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: MONGO_URI
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
